<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Names</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* אזור הגלגל המרכזי (תופס את רוב המסך) */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #ffffff;
        }

        .wheel-wrapper {
            position: relative;
            width: 530px;
            height: 530px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: transform 6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* החץ הכחול המדויק בצד ימין באמצע */
        .pointer-right {
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-right: 28px solid #2563eb; 
            z-index: 20;
        }

        /* עיגול לבן באמצע הגלגל */
        .center-circle {
            position: absolute;
            width: 165px;
            height: 165px;
            background: white;
            border-radius: 50%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 3px 8px rgba(0,0,0,0.08);
            z-index: 15;
            cursor: pointer;
        }

        /* --- סרגל הגדרות השמות בצד ימין - העתק מדויק של image_aaf786.png --- */
        .names-sidebar {
            width: 380px;
            background: white;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            padding: 16px;
            position: relative;
            box-shadow: -2px 0 10px rgba(0,0,0,0.02);
        }

        /* טאבים עליונים: ערכים ותוצאות */
        .sidebar-tabs {
            display: flex;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 15px;
            gap: 20px;
            padding-bottom: 5px;
        }
        .tab-item {
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-item.active {
            color: #1a1a1a;
            font-weight: bold;
            border-bottom: 3px solid #2563eb;
            margin-bottom: -8px;
            padding-bottom: 5px;
        }
        .tab-badge {
            background: #71717a;
            color: white;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 10px;
        }

        /* שורת הכפתורים המעוצבת של האתר */
        .tools-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 6px;
        }
        
        .right-tools {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .btn-tool {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* לוגו האתר הסגול/כחול העגול */
        .site-logo-circle {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* תיבת הטקסט הגדולה לשמות */
        textarea {
            flex: 1;
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            resize: none;
            outline: none;
            text-align: right;
            color: #1f2937;
            font-family: inherit;
        }

        /* חלק תחתון של הסרגל - כפתור הוספת גלגל וגרסה */
        .sidebar-footer {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .add-wheel-container {
            position: relative;
            display: inline-block;
            width: fit-content;
        }

        /* תגית בטא הצהובה הקטנה */
        .beta-tag {
            position: absolute;
            top: -10px;
            right: 5px;
            background: #fbbf24;
            color: #1e293b;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            z-index: 5;
        }

        .btn-add-wheel {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-version-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #9ca3af;
            padding-top: 5px;
        }
        .new-tag {
            background: #3b82f6;
            color: white;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
        }

        /* --- לוח בקרה סודי קטנצ'יק חבוי --- */
        .secret-admin-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .secret-admin-box select {
            width: 100%;
            padding: 4px;
            font-size: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            background: white;
        }

        /* פופ-אפ מנצח */
        .popup-winner {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .popup-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 360px; width: 90%;
        }
        .popup-content h1 { font-size: 36px; color: #1f2937; margin-bottom: 20px; }
        .popup-content button {
            padding: 8px 20px; background: #2563eb; color: white; border: none;
            border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="wheel-wrapper">
            <div class="pointer-right"></div>
            <div class="center-circle" onclick="spinWheel()"></div>
            <canvas id="canvas" width="600" height="600"></canvas>
        </div>
    </div>

    <div class="names-sidebar">
        
        <div class="sidebar-tabs">
            <div class="tab-item active">ערכים <span class="tab-badge" id="countBadge">2</span></div>
            <div class="tab-item">תוצאות <span class="tab-badge">0</span></div>
        </div>
        
        <div class="tools-row">
            <div class="right-tools">
                <button class="btn-tool">לערבב</button>
                <button class="btn-tool">סוג</button>
                <button class="btn-tool">הוסף תמונה</button>
            </div>
            <div class="site-logo-circle">W</div>
        </div>

        <div class="secret-admin-box">
            <select id="forcedWinner">
                <option value="">תוצאה: אקראי</option>
            </select>
        </div>

        <textarea id="namesInput" oninput="updateWheel()">צאט&#10;פטל</textarea>
        
        <div class="sidebar-footer">
            <div class="add-wheel-container">
                <div class="beta-tag">בטא</div>
                <button class="btn-add-wheel">הוסף גלגל +</button>
            </div>
            
            <div class="footer-version-row">
                <div>גרסה 411</div>
                <div class="new-tag">חדש!</div>
            </div>
        </div>

    </div>

    <div class="popup-winner" id="winnerPopup">
        <div class="popup-content">
            <h1 id="winnerName"></h1>
            <button onclick="closePopup()">סגור</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const namesInput = document.getElementById('namesInput');
    const forcedWinnerSelect = document.getElementById('forcedWinner');
    const winnerPopup = document.getElementById('winnerPopup');
    const winnerName = document.getElementById('winnerName');
    const countBadge = document.getElementById('countBadge');

    let names = [];
    let currentRotation = 0;
    let isSpinning = false;
    let isFirstTime = true; 

    // צבעים הפוכים: כחול למעלה (צאט), אדום למטה (פטל)
    const colors = ['#3b82f6', '#dc2626']; 

    function updateWheel() {
        names = namesInput.value.split('\n').map(n => n.trim()).filter(n => n !== "");
        countBadge.textContent = names.length;
        drawWheel();
        updateAdminSelect();
    }

    function updateAdminSelect() {
        const currentSelection = forcedWinnerSelect.value;
        forcedWinnerSelect.innerHTML = '<option value="">תוצאה: אקראי</option>';
        names.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = "תוצאה: " + name;
            if (name === currentSelection) option.selected = true;
            forcedWinnerSelect.appendChild(option);
        });
    }

    function drawTextAlongArc(text, centerX, centerY, radius, angle, color, isTop) {
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.font = "bold 23px sans-serif";
        ctx.fillStyle = color;
        ctx.textAlign = "center";

        if (isTop) {
            ctx.rotate(angle);
            ctx.fillText(text, 0, -radius + 35);
        } else {
            ctx.rotate(angle + Math.PI);
            ctx.fillText(text, 0, radius + 15);
        }
        ctx.restore();
    }

    function drawWheel() {
        const size = names.length;
        if (size === 0) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
        const sliceAngle = (2 * Math.PI) / size;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        names.forEach((name, i) => {
            const angle = (i * sliceAngle) - (Math.PI / 2);
            
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.moveTo(300, 300);
            ctx.arc(300, 300, 300, angle, angle + sliceAngle);
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (!isFirstTime || size !== 2) {
                ctx.save();
                ctx.translate(300, 300);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 24px sans-serif";
                ctx.fillText(name, 260, 8);
                ctx.restore();
            }
        });

        if (isFirstTime && size === 2) {
            ctx.save();
            ctx.translate(300, 300);
            ctx.fillStyle = "white";
            ctx.font = "bold 26px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(names[0], 0, -210);
            ctx.restore();
            drawTextAlongArc("לחץ כדי לסובב", 300, 300, 140, 0, "white", true);

            ctx.save();
            ctx.translate(300, 300);
            ctx.fillStyle = "white";
            ctx.font = "bold 26px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(names[1], 0, 240);
            ctx.restore();
            drawTextAlongArc("או לחץ על ctrl+enter", 300, 300, 140, 0, "white", false);
        }
    }

    function spinWheel() {
        if (names.length === 0 || isSpinning) return;
        isSpinning = true;

        if (isFirstTime) {
            isFirstTime = false;
            drawWheel(); 
        }

        const forcedWinner = forcedWinnerSelect.value;
        let winnerIndex;

        if (forcedWinner !== "" && names.includes(forcedWinner)) {
            winnerIndex = names.indexOf(forcedWinner);
        } else {
            winnerIndex = Math.floor(Math.random() * names.length);
        }

        const size = names.length;
        const sliceSizeDeg = 360 / size;
        const currentRotationModulo = currentRotation % 360;
        
        const targetSectorCenterDeg = (winnerIndex * sliceSizeDeg) + (sliceSizeDeg / 2) - 90;
        const distanceToTarget = (360 - targetSectorCenterDeg) - currentRotationModulo;
        const extraSpins = 7 * 360; 
        
        let finalSpread = distanceToTarget;
        if (finalSpread < 0) finalSpread += 360;

        currentRotation += extraSpins + finalSpread;
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            winnerName.textContent = names[winnerIndex];
            winnerPopup.style.display = 'flex';
            isSpinning = false;
        }, 6000);
    }

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') { spinWheel(); }
    });

    function closePopup() { winnerPopup.style.display = 'none'; }

    updateWheel();
</script>

</body>
</html>
